<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad)"/>

  <!-- Document/Report icon -->
  <g fill="white">
    <!-- Document outline -->
    <rect x="36" y="28" width="56" height="72" rx="4" fill="white"/>

    <!-- Lines representing text -->
    <rect x="44" y="40" width="40" height="4" rx="2" fill="#667eea"/>
    <rect x="44" y="50" width="40" height="4" rx="2" fill="#667eea"/>
    <rect x="44" y="60" width="32" height="4" rx="2" fill="#667eea"/>

    <!-- Download arrow -->
    <g fill="#764ba2">
      <rect x="61" y="70" width="6" height="16" rx="1"/>
      <polygon points="64,92 56,84 72,84"/>
    </g>
  </g>
</svg>
